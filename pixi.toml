[workspace]
channels = ["conda-forge"]
name = "navigator"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64", "linux-aarch64"]
version = "0.1.0"

[activation]
env = { PYTHONPATH = "." }

[tasks]
nav = "python -u navigator/navigator_main.py"
nav-watch = "python -m watchfiles --filter navigator.nav_watch_filter.NavigatorWatchFilter --grace-period 2 \"python -u navigator/navigator_main.py\" navigator/ gpio/ simulate/"
nav-service-autostart = "bash systemd/install-navigator-service.sh"
nav-service-autostart-off = "bash systemd/uninstall-navigator-service.sh"
nav-service-start = "systemctl --user start navigator"
nav-service-stop = "systemctl --user stop navigator"
nav-service-status = "bash systemd/navigator-service-status.sh"
nav-service-logs = "tail -f logs/navigator.log"
motion-range = "python navigator/motion_range_main.py"
hub-run = "python pybricks_client/ble_control.py run pybricks_hub/thin_ble_hub.py --no-wait"
hub-dev = "pybricksdev run ble pybricks_hub/thin_ble_hub.py --stay-connected"
ble-scan = "python pybricks_client/ble_control.py scan"
hub-stop = "python pybricks_client/ble_control.py stop"
hub-upload = "python pybricks_client/ble_control.py download pybricks_hub/thin_ble_hub.py"
test-hub = "python pybricks_client/test_hub.py"
test = "pytest --disable-socket --allow-unix-socket && pytest --force-enable-socket"

lcd-power-off = "python -u gpio/lcd_power_off_main.py"

precommit = "pre-commit run --all-files"
precommit-install = "pre-commit install"
# Survives reboot
bluetooth-off = "sudo systemctl disable --now bluetooth"
bluetooth-on = "sudo systemctl enable --now bluetooth"
# Does survice reboot
wifi-off = "sudo nmcli radio wifi off"
wifi-on = "sudo nmcli radio wifi on"

wifi-list = "nmcli -f NAME,UUID,TYPE,DEVICE,STATE,AUTOCONNECT,AUTOCONNECT-PRIORITY connection"
lcd-test = "python tests/lcd_test_main.py"
lcd-scan = "i2cdetect -y 1"

[dependencies]
micropython = ">=1.28.0,<2"
python = ">=3.13,<3.14"
nodejs = ">=26.8.2,<26.9"

[pypi-dependencies]
# Host-side API stubs for editing hub programs (Color, Port, etc.).
pybricks = "==4.0.0"
pybricksdev = "==2.3.2"
trimesh = ">=4.0"
scipy = ">=1.18.0"
astropy = ">=8.0.1"
pre-commit = ">=4.0"
ruff = "==0.14.14"
ty = "==0.0.14"
watchfiles = ">=1.0"
skyfield = ">=1.55, <2"
pytest = ">=9.1.1, <10"
pytest-asyncio = ">=1.4.0, <2"
pytest-socket = ">=0.8.1, <0.9"

[target.linux.pypi-dependencies]
gpiod = ">=2.5.0, <3"
smbus2 = ">=0.4.3, <0.6"


# pybricks-ble depends on an old pybricks-api git commit (3.6.1). Without this
# override, pixi cannot install pybricks 4.0.0 from PyPI alongside pybricks-ble.
# pybricks_client/pb_ble_import.py works around pybricks-ble's broken __init__ on 4.x.
[pypi-options.dependency-overrides]
pybricks = "==4.0.0"
