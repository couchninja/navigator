repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-toml
    - id: check-merge-conflict

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.14
  hooks:
    # Ruff linter and ruff formatter are separate checks, run them both
    - id: ruff
      args: [--fix]
    - id: ruff-format

- repo: https://github.com/pre-commit/mirrors-prettier
  rev: v3.1.0
  hooks:
    - id: prettier
      language_version: "22.14.0"
      files: ^navigator/web_viewer/
      exclude: ^navigator/web_viewer/(dist|node_modules)/

- repo: https://github.com/allganize/ty-pre-commit
  rev: v0.0.14
  hooks:
    - id: ty-check
      args: [--error-on-warning]

- repo: local
  hooks:
    - id: pytest
      name: pytest (offline and online)
      entry: pixi run test
      language: system
      pass_filenames: false
      always_run: true
