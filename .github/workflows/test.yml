name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          cache: true

      - name: Install web viewer npm dependencies
        working-directory: navigator/web_viewer
        run: pixi run npm install

      - name: Run tests (offline and online)
        run: pixi run test
